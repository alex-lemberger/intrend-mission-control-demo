name: Deploy public demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'alex-lemberger/intrend-mission-control-demo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public site allowlist
        shell: bash
        run: |
          set -euo pipefail
          test ! -e site/.git
          test -z "$(find site -type l -print)"
          actual="$(find site -type f -print | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            site/ac01.css \
            site/ac01.js \
            site/app.js \
            site/index.html \
            site/stundenzettel.html \
            site/styles.css \
            site/timesheet-view.js \
            site/vendor/ac01-core.bundle.js \
            site/vendor/stundenzettel.bundle.js \
            site/workday-store.js)"
          test "$actual" = "$expected"
          for f in $expected; do test -s "$f"; done
          # no network calls, storage or dynamic code in any published file
          if grep -rEn 'fetch\(|XMLHttpRequest|WebSocket|sendBeacon|importScripts|serviceWorker|localStorage|sessionStorage|indexedDB|document\.cookie|eval\(|new Function' site; then exit 1; fi
          # the only absolute URL allowed is the SVG namespace inside the synthetic placeholder images
          if grep -rhoE 'https?://[^"'"'"' )<>\\]+' site | grep -vx 'http://www.w3.org/2000/svg'; then exit 1; fi
          # visible demo labels and the memory-only warning must stay
          grep -q 'DEMO / SYNTHETISCHE DATEN' site/index.html
          grep -q 'nach dem Neuladen der Seite ist alles weg' site/index.html
          # compatibility page: relative redirect and visible link to AC-01 only
          grep -q 'http-equiv="refresh" content="5; url=index.html#ac01"' site/stundenzettel.html
          grep -q 'href="index.html#ac01"' site/stundenzettel.html
      - name: Upload only the public site directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: prepare
    if: github.repository == 'alex-lemberger/intrend-mission-control-demo'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
