name: Deploy public demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'alex-lemberger/intrend-mission-control-demo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public site allowlist
        shell: bash
        run: |
          set -euo pipefail
          test ! -e site/.git
          test -z "$(find site -type l -print)"
          actual="$(find site -type f -print | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            site/ac01.css \
            site/ac01.js \
            site/app.js \
            site/behinderung-view.js \
            site/icons.js \
            site/index.html \
            site/spacing.css \
            site/stundenzettel.html \
            site/styles.css \
            site/timesheet-view.js \
            site/vendor/ac01-core.bundle.js \
            site/vendor/lv.bundle.js \
            site/vendor/planner.bundle.js \
            site/vendor/stundenzettel.bundle.js \
            site/workday-store.js)"
          test "$actual" = "$expected"
          for f in $expected; do test -s "$f"; done
          # no network calls or dynamic code in any published file; session storage, IndexedDB and cookies are never used
          if grep -rEn 'fetch\(|XMLHttpRequest|WebSocket|sendBeacon|importScripts|serviceWorker|sessionStorage|indexedDB|document\.cookie|eval\(|new Function' site; then exit 1; fi
          # browser local storage (decided by the owner: 2026-11-20 for the planner, 2026-11-21 for the saved working days and for the
          # Leistungsverzeichnis, so that a viewer can keep worked-through examples on their own device): allowed ONLY in these three files,
          # only under this demo's own key prefix, and only with the warnings that no real data may be entered
          if grep -rl 'localStorage' site | grep -vxE 'site/vendor/planner\.bundle\.js|site/vendor/lv\.bundle\.js|site/workday-store\.js'; then exit 1; fi
          grep -q 'intrend-mc-demo:' site/vendor/planner.bundle.js
          grep -q 'intrend-mc-demo:workdays:v1' site/workday-store.js
          if grep -hoE 'intrend-mc-demo:[A-Za-z0-9:_-]*' site/workday-store.js | grep -vx 'intrend-mc-demo:workdays:v1'; then exit 1; fi
          grep -q 'intrend-mc-demo:lv:v1:' site/vendor/lv.bundle.js
          if grep -hoE 'intrend-mc-demo:[A-Za-z0-9:_-]*' site/vendor/lv.bundle.js | grep -vxE 'intrend-mc-demo:|intrend-mc-demo:lv:v1:|intrend-mc-demo:probe'; then exit 1; fi
          grep -q 'Bitte nur erfundene Daten eingeben' site/vendor/lv.bundle.js
          grep -q 'Keine echten Daten eingeben' site/index.html
          grep -q 'Bitte nur erfundene Daten eingeben' site/app.js
          # the only absolute URL allowed is the SVG namespace inside the synthetic placeholder images
          if grep -rhoE 'https?://[^"'"'"' )<>\\]+' site | grep -vx 'http://www.w3.org/2000/svg'; then exit 1; fi
          # no stakeholder names, internal identifiers, tenant references or template-specific legal wording in any published file
          if grep -rEin 'peter|merlin|sharepoint|transkript|whatsapp|stakeholder|\bSC-[0-9]+|\bCB-[0-9]+|\bDEP-[0-9]+|\bSEC-[0-9]+|VOB' site; then exit 1; fi
          # visible demo labels and the memory-only warning must stay
          grep -q 'DEMO / SYNTHETISCHE DATEN' site/index.html
          grep -q 'nach dem Neuladen der Seite ist alles weg' site/index.html
          # compatibility page: relative redirect and visible link to AC-01 only
          grep -q 'http-equiv="refresh" content="5; url=index.html#ac01"' site/stundenzettel.html
          grep -q 'href="index.html#ac01"' site/stundenzettel.html
      - name: Upload only the public site directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: prepare
    if: github.repository == 'alex-lemberger/intrend-mission-control-demo'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
